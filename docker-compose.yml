version: '3.8'

services:
  evolution-go:
    image: evolution-go:latest
    container_name: evolution-go
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${GLOBAL_API_KEY}

      POSTGRES_AUTH_DB: postgresql://postgres:root@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://postgres:root@postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: ${DATABASE_SAVE_MESSAGES}

      WADEBUG: ${WADEBUG}
      LOGTYPE: ${LOGTYPE}
      WEBHOOK_FILES: ${WEBHOOK_FILES}
      CONNECT_ON_STARTUP: ${CONNECT_ON_STARTUP}
      OS_NAME: ${OS_NAME}

      AMQP_URL: amqp://admin:admin@rabbitmq:5672/default
      AMQP_GLOBAL_ENABLED: ${AMQP_GLOBAL_ENABLED}

      WEBHOOK_URL: ${WEBHOOK_URL}

      MINIO_ENABLED: ${MINIO_ENABLED}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
    volumes:
      - evolution_data:/app/dbdata
    networks:
      - evolution_network
    depends_on:
      - postgres
      - rabbitmq
      - minio

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    # Headroom. The gateway used to leak a connection pool per reconnect until it
    # exhausted the default 100 and no instance could reach WhatsApp at all; the
    # leak itself is fixed in deviceContainer(), this is the seatbelt.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/examples/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - evolution_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: evolution-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: default
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - evolution_network

  minio:
    image: minio/minio:latest
    container_name: evolution-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - evolution_network

volumes:
  evolution_data:
    driver: local
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

networks:
  evolution_network:
    driver: bridge
